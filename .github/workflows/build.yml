name: Build APK & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASS: ${{ secrets.KEY_PASS }}
  KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign APK (permanent keystore)
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore

          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

          $ANDROID_HOME/build-tools/$BT/zipalign -v -p 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out HomeMonitor.apk aligned.apk

          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs HomeMonitor.apk | head -3

      - name: Set release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "name=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: HomeMonitor ${{ steps.tag.outputs.name }}
          body: |
            Automated build #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: HomeMonitor.apk
          prerelease: false

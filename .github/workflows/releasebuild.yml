name: Build APK & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign APK (debug keystore)
        run: |
          # Release APK by default unsigned hota hai, install nahi hoga.
          # Isliye ek keystore bana ke sign kar rahe hain.
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias homemonitor \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=HomeMonitor, OU=Dev, O=Yash, L=IN, S=IN, C=IN"

          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

          $ANDROID_HOME/build-tools/$BT/zipalign -v -p 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks release.keystore \
            --ks-key-alias homemonitor \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out HomeMonitor.apk aligned.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeMonitor-APK
          path: HomeMonitor.apk

      - name: Set release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "name=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: HomeMonitor ${{ steps.tag.outputs.name }}
          body: |
            Automated build #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: HomeMonitor.apk
          prerelease: false

